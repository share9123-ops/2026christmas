<div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 96px 24px 72px">
<div style="display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px; border: 1px solid rgba(217,184,114,0.6); border-radius: 999px; color: #E8CF93; font-size: 14px; font-weight: 500; letter-spacing: 0.04em"><span style="width: 6px; height: 6px; border-radius: 50%; background: rgb(224, 71, 92)"></span><span style="background-color: transparent; font-size: 21px">2026 부천희망재단</span></div>
<h1 class="serif" style="display: table; text-align: justify; text-align-last: justify; margin: 28px 0 0; font-size: 70px; line-height: 1.18; font-weight: 900; letter-spacing: -0.05em; word-spacing: -0.06em">크리스마스의 기적<br>지원사업 통합 공모</h1>
<p class="serif" style="margin: 28px 0 0; max-width: 720px; font-size: 21px; line-height: 1.7; font-weight: 600; color: #F3EBD8">누군가의 일상에 희망을, 이웃을 돌보는 사람에게 쉼을,<br>우리 지역에 새로운 변화를 지원합니다.</p>
<div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px">
<a href="#programs" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: #C9A55C; color: #173F2C; font-weight: 700; font-size: 16px; text-decoration: none">지원사업 살펴보기</a>
<a href="{{noticeUrl}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.55); color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">공모안내문 · 신청서 다운로드</a>
</div>
<div style="margin-top: 64px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: rgba(217,184,114,0.35); border: 1px solid rgba(217,184,114,0.35); border-radius: 16px; overflow: hidden">

<div style="font-size: 16px; color: #CFDCD3">18:00 마감</div>
</div>
<div style="background: rgba(18,48,33,0.92); padding: 24px 28px">
<div style="font-size: 16px; color: #D9B872; font-weight: 700; letter-spacing: 0.06em">총 지원규모</div>
<div style="margin-top: 6px; font-size: 20px; font-weight: 700">총 4,900만 원</div>
<div style="font-size: 16px; color: #CFDCD3">31가구 · 5팀 · 2단체</div>
</div>
<div style="background: rgba(18,48,33,0.92); padding: 24px 28px">
<div style="font-size: 16px; color: #D9B872; font-weight: 700; letter-spacing: 0.06em">지원사업</div>
<div style="margin-top: 6px; font-size: 20px; font-weight: 700">4개 영역</div>
<div style="font-size: 16px; color: #CFDCD3">이웃 · 공익활동가 · 어르신 · 지역</div>
</div>
<div style="background: rgba(18,48,33,0.92); padding: 24px 28px">
<div style="font-size: 16px; color: #D9B872; font-weight: 700; letter-spacing: 0.06em">사업기간</div>
<div style="margin-top: 6px; font-size: 20px; font-weight: 700">2026.11 ~ 2027.7</div>
<div style="font-size: 16px; color: #CFDCD3">사업별 수행기간 상이</div>
</div>
</div>

<!-- ===== 사업소개 ===== -->
<section id="about" style="max-width: 1200px; margin: 0 auto; padding: 104px 24px 40px; display: flex; flex-wrap: wrap; gap: 40px 72px">
<div style="flex: 1 1 320px">
<div style="font-size: 16px; font-weight: 700; color: #9B2335; letter-spacing: 0.12em">■ 사업소개</div>
<h2 class="serif" style="margin: 12px 0 0; font-size: 40px; line-height: 1.35; color: #173F2C">시민의 나눔이<br>지역의 기적이 됩니다</h2>
</div>
<div style="flex: 999 1 520px; min-width: 0; font-size: 17px; color: #3B4A41">
<p style="margin: 0">「크리스마스의 기적」은 시민의 나눔으로 마련된 기금을 통해 이웃의 어려움을 살피고, 지역을 위해 활동하는 사람들을 응원하며, 주민과 함께 지역의 변화를 만들어 가는 부천희망재단의 대표 배분사업입니다.</p>
<p style="margin: 16px 0 0">올해는 기존 이웃 지원에 <strong style="color: rgb(23, 63, 44)">공익활동가의 쉼과 회복</strong>, <strong style="color: rgb(23, 63, 44)">폐지수집 어르신의 생활 속 소원 실현</strong>, <strong style="color: rgb(23, 63, 44)">주민과 함께하는 지역문제 해결</strong>을 더해 총 4개 지원사업을 통합 공모 합니다.</p>
<div style="margin-top: 28px; padding: 18px 22px; background: #F4EEE1; border-radius: 12px; display: flex; gap: 14px; align-items: flex-start; font-size: 15px; color: #4A3C22">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A7433" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="12.5"></line><circle cx="12" cy="16" r="0.6" fill="#9A7433"></circle></svg>
<span>모든 사업은 <strong>기관·단체·팀 단위로 신청</strong>합니다. 개인이 직접 신청할 수 없으니, 지원이 필요한 이웃을 알고 계시다면 가까운 사회복지기관이나 동 행정복지센터에 추천을 요청해 주세요.</span>
</div>
</div>
</section>

<!-- ===== 4개 지원사업 개요 ===== -->
<section id="programs" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 24px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<div style="font-size: 16px; font-weight: 700; color: #9B2335; letter-spacing: 0.12em">■ 지원영역</div>
<h2 class="serif" style="margin: 12px 0 0; font-size: clamp(28px, 3.2vw, 40px); line-height: 1.35; color: #173F2C">4개 지원사업 한눈에 보기</h2>
</div>
<p style="margin: 0; font-size: 15px; color: #5B6A60; font-weight: 700">※ 카드를 누르면 아래에서 사업별 세부 안내를 확인할 수 있습니다.</p>
</div>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{programs}}" as="p">
<a href="#detail" onclick="{{p.pick}}" style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 28px 26px 26px; background: #FFFFFF; border: 1px solid {{p.cardBorder}}; border-radius: 18px; text-decoration: none; color: #1E2A23; box-shadow: {{p.cardShadow}}">
<div style="display: flex; align-items: center; justify-content: space-between">
<span class="serif" style="font-size: 34px; font-weight: 900; line-height: 1; color: {{p.color}}">{{p.no}}</span>
<span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: {{p.soft}}; color: {{p.color}}">{{p.badge}}</span>
</div>
<div>
<div style="font-size: 21px; font-weight: 700; color: #173F2C; line-height: 1.4">{{p.name}}</div>
<div style="margin-top: 2px; font-size: 13px; color: #8A6A2F; font-weight: 500">{{p.fundLine}}</div>
</div>
<p style="margin: 0; font-size: 15px; color: #4A584F; line-height: 1.65">{{p.tagline}}</p>
<div style="margin-top: auto; padding-top: 16px; border-top: 1px dashed #E2D8C3; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<div style="display: flex; gap: 10px; min-height: 45px"><span style="flex: none; width: 56px; color: #7A877F">신청</span><span style="font-weight: 500">{{p.applicantShort}}</span></div>
<div style="display: flex; gap: 10px"><span style="flex: none; width: 56px; color: #7A877F">지원규모</span><span style="font-weight: 700; color: {{p.color}}">{{p.scale}}</span></div>
</div>
</a>
</sc-for>
</div>
</section>

<!-- ===== 사업별 세부 안내 (탭) ===== -->
<section id="detail" style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 24px">
<div role="tablist" aria-label="지원사업 선택" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: #F1EADA; border-radius: 16px">
<sc-for list="{{programs}}" as="p">
<button type="button" role="tab" aria-selected="{{p.selected}}" onclick="{{p.pick}}" style="flex: 1 1 200px; min-height: 52px; padding: 10px 16px; border: 0; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 700; background: {{p.tabBg}}; color: {{p.tabFg}}; box-shadow: {{p.tabShadow}}">{{p.no}} {{p.name}}</button>
</sc-for>
</div>

<div style="margin-top: 24px; background: #FFFFFF; border: 1px solid #E6DCC6; border-radius: 22px; overflow: hidden">
<div style="padding: 40px 44px 36px; background: {{cur.soft}}; border-bottom: 1px solid #E6DCC6; display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: flex-end; justify-content: space-between">
<div style="flex: 999 1 520px; min-width: 0">
<div style="font-size: 14px; font-weight: 700; color: {{cur.color}}">{{cur.no}} · {{cur.fundLine}}</div>
<h3 class="serif" style="margin: 8px 0 0; font-size: clamp(26px, 3vw, 36px); line-height: 1.3; color: #173F2C">{{cur.name}}</h3>
<p style="margin: 14px 0 0; font-size: 16px; color: #3B4A41; max-width: 720px">{{cur.desc}}</p>
</div>
<div style="flex: 1 1 240px; padding: 20px 24px; background: #FFFFFF; border-radius: 14px; border: 1px solid {{cur.line}}">
<div style="font-size: 13px; color: #7A877F">지원규모</div>
<div style="font-size: 26px; font-weight: 900; color: {{cur.color}}; line-height: 1.3">{{cur.amount}}</div>
<div style="font-size: 14px; color: #3B4A41; font-weight: 500">{{cur.amountSub}}</div>
</div>
</div>

<div style="padding: 40px 44px 44px; display: flex; flex-direction: column; gap: 44px">
<div>
<h4 style="margin: 0 0 16px; font-size: 19px; color: #173F2C; display: flex; align-items: center; gap: 10px"><span style="width: 4px; height: 18px; border-radius: 2px; background: {{cur.color}}"></span>누가 신청할 수 있나요?</h4>
<div style="display: flex; flex-direction: column; border-top: 2px solid #173F2C">
<sc-for list="{{cur.rows}}" as="r">
<div style="display: flex; flex-wrap: wrap; border-bottom: 1px solid #ECE4D2">
<div style="flex: 0 0 140px; padding: 16px 18px; background: #FAF6EC; font-weight: 700; font-size: 15px; color: #2F4A3B">{{r.k}}</div>
<div style="flex: 1 1 360px; min-width: 0; padding: 16px 20px; font-size: 15px; color: #2B3530; white-space: pre-line">{{r.v}}</div>
</div>
</sc-for>
</div>
<sc-if value="{{cur.hasTiers}}">
<div style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<sc-for list="{{cur.tiers}}" as="t">
<div style="padding: 18px 20px; border: 1px solid #ECE4D2; border-radius: 14px; background: #FFFDF8">
<div style="font-size: 15px; font-weight: 700; color: #173F2C">{{t.k}}</div>
<div style="margin-top: 4px; font-size: 14px; color: #5B6A60">{{t.n}} · 가구당 최대</div>
<div style="font-size: 20px; font-weight: 900; color: {{cur.color}}">{{t.v}}</div>
</div>
</sc-for>
</div>
</sc-if>

          { g: '선정 후 제출', tag: '선정단체', items: '⑧ 지원사업 협약서 및 지원금 수령 통장 사본 등' }
        ],
        docNote: '※ 여러 기관이 공동으로 신청하는 경우 신청자격을 갖춘 대표단체 1곳을 지정하여 신청합니다.',
        score: [
          { k: '해결 방법의 타당성', p: '30점', w: '30%', d: '' },
          { k: '지역문제의 구체성', p: '25점', w: '25%', d: '' },
          { k: '주민 참여와 협력', p: '20점', w: '20%', d: '' },
          { k: '실행계획 및 예산의 적절성', p: '15점', w: '15%', d: '' },
          { k: '변화 확인 방법', p: '10점', w: '10%', d: '' }
        ],
        criteria: [ '동점인 경우 해당 문제를 겪는 주민이 기획과 실행에 직접 참여하는 사업 우선', '동일 사업 또는 동일 비용에 대해 다른 지원사업과 중복지원 불가' ],
        run: '2026.12 ~ 2027.6', report: '2027년 7월',
        notes: [ '사업계획에는 지역문제와 확인 근거, 주민·협력기관의 역할, 실행계획, 사업으로 확인하고자 하는 변화를 구체적으로 제시해 주세요.', '지원금은 신청단체 또는 협력단체 명의 계좌로 지급하며, 개인 명의 계좌로는 지급할 수 없습니다.', '사업기간 중 진행상황을 이메일로 1회 제출하고, 종료 후 30일 이내 결과·정산보고서를 제출합니다.' ]
      }
    ];

  var state = { picked: 0 };
  function setState(s) { Object.assign(state, s); render(); }

  function renderVals() {
    var picked = state.picked;
    var programs = P.map(function (p, i) {
      var sel = i === picked;
      return Object.assign({}, p, {
        selected: sel ? 'true' : 'false',
        pick: function () { setState({ picked: i }); },
        tabBg: sel ? p.color : 'transparent',
        tabFg: sel ? '#FFFFFF' : '#3B4A41',
        tabShadow: sel ? '0 8px 20px -10px ' + p.color : 'none',
        cardBorder: sel ? p.color : '#E6DCC6',
        cardShadow: sel ? '0 22px 40px -26px ' + p.color : '0 10px 30px -24px rgba(23,63,44,0.25)'
      });
    });
    var c = P[picked];
    var score = (c.score || []).map(function (s) { return Object.assign({}, s, { hasD: !!s.d }); });
    var cur = Object.assign({}, c, {
      score: score,
      tiers: c.tiers || [], areas: c.areas || [], allowed: c.allowed || [], criteria: c.criteria || [],
      hasTiers: (c.tiers || []).length > 0,
      hasAreas: (c.areas || []).length > 0,
      hasAllowed: (c.allowed || []).length > 0,
      hasExcluded: !!c.excluded,
      hasScore: score.length > 0
    });
    return { programs: programs, cur: cur, noticeUrl: NOTICE_URL };
  }

  // ===== 작은 템플릿 렌더러 ({{값}}, sc-for, sc-if) =====
  var RX = /\{\{\s*([^}]+?)\s*\}\}/g;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
  }
  function whole(str) { var m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str || ''); return m ? m[1] : null; }
  function interp(str, scope) { return str.replace(RX, function (_, p) { var v = get(scope, p); return v == null ? '' : String(v); }); }
  function child(scope, extra) { var s = Object.create(scope); for (var k in extra) s[k] = extra[k]; return s; }

  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = get(scope, whole(node.getAttribute('list'))) || [];
      var as = node.getAttribute('as');
      list.forEach(function (it, i) {
        var extra = { $index: i }; extra[as] = it;
        var s = child(scope, extra);
        node.childNodes.forEach(function (c) { build(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (get(scope, whole(node.getAttribute('value')))) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function (a) {
      if (a.name.indexOf('on') === 0) {
        el.removeAttribute(a.name);
        var fn = get(scope, whole(a.value) || '');
        if (typeof fn === 'function') {
          el.addEventListener(a.name.slice(2), function (e) {
            var href = el.getAttribute('href');
            var hash = href && href.charAt(0) === '#';
            if (hash) e.preventDefault();
            fn(e);
            if (hash) { var t = document.getElementById(href.slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth' }); }
          });
        }
        return;
      }
      if (a.value.indexOf('{{') !== -1) el.setAttribute(a.name, interp(a.value, scope));
    });
    node.childNodes.forEach(function (c) { build(c, scope, el); });
    out.appendChild(el);
  }

  var tpl = document.getElementById('app-tpl');
  var root = document.getElementById('app');
  function render() {
    var vals = renderVals();
    var frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach(function (c) { build(c, vals, frag); });
    root.replaceChildren(frag);
  }
  render();
  if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
